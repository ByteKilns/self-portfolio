<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nirjal's Portfolio</title>
    <script>
      (function () {
        let saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch {
          // localStorage unavailable; fall back to the OS preference.
        }
        const dark =
          saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = dark ? '/bg/gradient-dark.webp' : '/bg/gradient-light.webp';
        document.head.appendChild(preload);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
